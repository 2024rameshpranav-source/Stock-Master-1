<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup | StockMaster</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="login.html">Login</a>
    </nav>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <label for="signupLoginId">Login Id:</label>
            <input type="text" id="signupLoginId" required>
            <label for="signupEmail">Email Id:</label>
            <input type="email" id="signupEmail" required>
            <label for="signupPassword">Password:</label>
            <input type="password" id="signupPassword" required>
            <label for="signupPassword2">Re-enter Password:</label>
            <input type="password" id="signupPassword2" required>
            <button type="submit">Sign Up</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
