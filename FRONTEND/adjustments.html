<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adjustments | StockMaster</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="movehistory.html">Move History</a>
    </nav>
    <div class="container">
        <h2>Stock Adjustments</h2>
        <form>
            <label for="product">Product:</label>
            <input type="text" id="product" required>
            <label for="current_qty">Current Quantity:</label>
            <input type="number" id="current_qty" required>
            <label for="new_qty">New Quantity:</label>
            <input type="number" id="new_qty" required>
            <button type="submit">Submit Adjustment</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
